services:
  db:
    image: postgres:16-alpine
    container_name: receipt_db
    environment:
      POSTGRES_USER: receipt
      POSTGRES_PASSWORD: receipt3747
      POSTGRES_DB: receipt_scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receipt -d receipt_scanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: